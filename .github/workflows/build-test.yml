name: CI Firmware & Simulation Build Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install scikit-rf matplotlib numpy build twine

    - name: Run Technical & Financial Simulation
      env:
        MPLBACKEND: Agg
      run: |
        python scripts/financial_and_tech_sim.py

    - name: Validate Repository File Layout
      run: |
        test -f firmware/mems_mesh_driver.c || test -f firmware/src/mems_mesh_driver.c
        test -f docs/FABRICATION_GUIDE.md
        echo "Repository File Layout Check Passed!"
