name: CI Firmware & Simulation Build Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install scikit-rf matplotlib numpy build twine

    - name: Run Financial & Technical Simulation
      env:
        MPLBACKEND: Agg
      run: |
        python scripts/financial_and_tech_sim.py

    - name: Install C Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential

    - name: Syntax Check C Kernel Driver
      run: |
        gcc -fsyntax-only firmware/mems_mesh_driver.c || gcc -fsyntax-only firmware/src/mems_mesh_driver.c
        echo "C Driver Syntax Check Passed"
