[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rf-mems-mesh-sim"
version = "1.0.0"
description = "Simulation suite for 6 GHz Rogers RO4350B CPWG traces and Menlo Micro RF-MEMS cold-switching dynamics."
keywords = [
    "rf-mems",
    "6ghz",
    "menlo-micro",
    "ro4350b",
    "cpwg",
    "cold-switching",
    "s-parameters",
    "openwrt",
    "unit-economics"
]readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = [
    "scikit-rf>=0.24.0",
    "numpy>=1.21.0",
    "matplotlib>=3.5.0",
]

[project.urls]
"Homepage" = "https://github.com/Abhishek1033ubuntu/Commercial-6-GHz-RF-MEMS-Mesh-Network-System"
"Bug Tracker" = "https://github.com/Abhishek1033ubuntu/Commercial-6-GHz-RF-MEMS-Mesh-Network-System/issues"

# --- ADD THIS SECTION BELOW TO FIX THE BUILD ---
[tool.setuptools.packages.find]
where = ["python_pkg"]
